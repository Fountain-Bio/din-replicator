# Runs on every push and pull request on Blacksmith runners. The TypeScript
# checks run once on Ubuntu. The Rust tests run on macOS and Windows because the
# printer transport has one implementation per platform and only that platform
# can compile it.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-6vcpu-macos-latest, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
