# Builds the installers on Blacksmith runners when a version tag is pushed, and attaches them
# to a draft GitHub release. `scripts/release.ts` creates the tag. `docs/releasing.md` walks
# through the whole procedure.
#
# Signing is driven by repository secrets alone. When a platform's secrets are missing, that
# platform still builds and still uploads its artifacts, unsigned, and the job log carries a
# notice saying so. `scripts/setup-signing.sh` creates and stores every secret listed here.
#
# macOS. A Developer ID Application certificate signs the app, and Apple notarizes it.
#   APPLE_CERTIFICATE
#     Base64 text of the Developer ID Application certificate exported from Keychain Access
#     as a .p12 file. Produced by `openssl base64 -A -in certificate.p12`.
#   APPLE_CERTIFICATE_PASSWORD
#     The password chosen while exporting that .p12 file.
#   KEYCHAIN_PASSWORD
#     Any random string. It unlocks the throwaway keychain this job creates to hold the
#     certificate. It protects nothing outside the runner.
#   APPLE_ID
#     Email address of the Apple account that owns the certificate.
#   APPLE_PASSWORD
#     An app-specific password for that Apple account, created at appleid.apple.com. Apple
#     rejects the account password here.
#   APPLE_TEAM_ID
#     The ten character Team ID from the membership page at developer.apple.com/account.
#
# Windows. Azure Artifact Signing, the service Microsoft used to call Azure Trusted Signing,
# signs the installer. The first three values come from a Microsoft Entra ID app registration
# that has been granted the signing role. The last three name the signing account itself.
#   AZURE_TENANT_ID
#     Directory (tenant) ID of the Microsoft Entra ID directory.
#   AZURE_CLIENT_ID
#     Application (client) ID of the app registration.
#   AZURE_CLIENT_SECRET
#     A client secret created for that app registration.
#   AZURE_ARTIFACT_SIGNING_ENDPOINT
#     Regional service URL of the signing account, such as https://wus2.codesigning.azure.net.
#   AZURE_ARTIFACT_SIGNING_ACCOUNT
#     Name of the Azure Artifact Signing account.
#   AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE
#     Name of the certificate profile inside that account.
#
# Updates. Every release is signed with a minisign key so an installed app will only accept an
# update this key signed. The key is independent of the Apple and Azure code signing above, and
# a build with no code signing still produces a valid update.
#   TAURI_SIGNING_PRIVATE_KEY
#     Contents of the private key file produced by `bun run tauri signer generate`.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     The password that key was generated with.
# Losing both the key file and the password means already installed apps can never be updated
# again, because the public key baked into them will match nothing you can sign in future.
#
# GitHub. The draft release is created and the artifacts are uploaded with the GitHub CLI and
# the built-in GITHUB_TOKEN, which the job grants contents: write. tauri-action only builds;
# its own release step fails in this organization with "Resource not accessible by
# integration" even though the same request succeeds from a plain step.
#
# Sources for the steps below:
#   https://v2.tauri.app/distribute/sign/macos/
#   https://v2.tauri.app/distribute/sign/windows/
#   https://v2.tauri.app/distribute/pipelines/github/
#   https://github.com/tauri-apps/tauri-action
name: release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    name: macOS (Apple silicon)
    # tauri-action creates the draft release with GITHUB_TOKEN, which needs write access to
    # the repository contents.
    permissions:
      contents: write
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile

      # A step `if:` cannot read the `secrets` context, so whether the Apple secrets exist
      # becomes a step output the later steps can read.
      - name: Decide whether this build can be signed
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          signed=true
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              signed=false
            fi
          done
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Report that this build is unsigned
        if: steps.signing.outputs.signed != 'true'
        run: |
          echo "::notice title=Unsigned build::The Apple signing secrets are not set on this repository, so this DMG is unsigned and not notarized. docs/releasing.md lists the secrets and scripts/setup-signing.sh creates them."

      # https://v2.tauri.app/distribute/sign/macos/ under "Signing in CI/CD platforms".
      # The certificate goes into a keychain that lives only for this job. The identity string
      # codesign needs is read back out of that keychain, so it never has to be stored as a
      # secret of its own. Exporting it through GITHUB_ENV rather than the build step's `env:`
      # block means it is genuinely absent on an unsigned build, which is what makes the
      # bundler skip signing instead of failing on an empty identity.
      - name: Import the Developer ID Application certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          certificate="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # Keep the keychain unlocked for an hour so a long notarization wait cannot lock it.
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$certificate" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$certificate"

          identity=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -n 1 | awk -F'"' '{print $2}') || true
          if [ -z "$identity" ]; then
            echo "the imported certificate is not a Developer ID Application certificate" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build the DMG
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # bundle.createUpdaterArtifacts in tauri.conf.json makes the bundler write
          # `DIN Replicator.app.tar.gz` next to the DMG and sign it with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_SIGNING_IDENTITY comes from the certificate import step. The bundler reads
          # the notarization credentials only after it has signed something, so leaving them
          # empty on an unsigned build changes nothing.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target aarch64-apple-darwin

      # The bundler notarizes and staples the .app inside the image. The disk image itself is
      # only signed, and Gatekeeper judges the image when it is opened, so it is notarized and
      # stapled here as well. https://developer.apple.com/documentation/security/notarizing-macos-software-before-distribution
      - name: Notarize and staple the DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          for dmg in src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            spctl --assess --type open --context context:primary-signature -v "$dmg"
          done

      # The DMG is what a person downloads. The .app.tar.gz is what an installed app downloads
      # when it updates itself, and the .sig beside it is the minisign signature the updater
      # checks against the public key in tauri.conf.json. The updater-manifest job reads that
      # .sig back off the release.
      - name: Attach the DMG and the update bundle to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # Both platform jobs run this; whichever gets here first creates the draft.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "DIN Replicator $TAG" --notes "" \
            || gh release view "$TAG" >/dev/null
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          gh release upload "$TAG" --clobber "$bundle"/dmg/*.dmg
          if ls "$bundle"/macos/*.app.tar.gz >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig
          else
            echo "::warning title=No update bundle::TAURI_SIGNING_PRIVATE_KEY is not set, so no signed macOS update bundle was produced and installed apps will not see this release."
          fi

  windows:
    name: Windows
    permissions:
      contents: write
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile

      # Same pattern as the macOS job: secret presence becomes a step output. On an unsigned
      # build the signCommand in tauri.conf.json is removed from the effective config, because
      # the bundler would otherwise run artifact-signing-cli, which is not installed and has
      # nothing to authenticate with. A `--config` patch follows RFC 7386 merge semantics,
      # where null removes a key.
      - name: Decide whether this build can be signed
        id: signing
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          set -eu
          signed=true
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                      AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT \
                      AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE; do
            if [ -z "${!name}" ]; then
              signed=false
            fi
          done
          extra_args=""
          if [ "$signed" = false ]; then
            extra_args='--config {"bundle":{"windows":{"signCommand":null}}}'
          fi
          {
            echo "signed=$signed"
            echo "extra_args=$extra_args"
          } >> "$GITHUB_OUTPUT"

      - name: Report that this build is unsigned
        if: steps.signing.outputs.signed != 'true'
        shell: bash
        run: |
          echo "::notice title=Unsigned build::The Azure signing secrets are not set on this repository, so this installer is unsigned and Windows shows a SmartScreen warning on first launch. docs/releasing.md lists the secrets and scripts/setup-signing.sh creates them."

      # https://v2.tauri.app/distribute/sign/windows/ under "Azure Artifact Signing".
      # tauri.conf.json > bundle > windows > signCommand runs this binary once per file the
      # bundler produces, so it has to be on PATH before the build starts.
      - name: Install artifact-signing-cli
        if: steps.signing.outputs.signed == 'true'
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      - name: Build the installer
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # bundle.createUpdaterArtifacts in tauri.conf.json makes the bundler sign the NSIS
          # installer with this key and write the signature beside it as a .exe.sig file. The
          # installer is itself the update payload on Windows.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # artifact-signing-cli reads the credentials and the account and certificate profile
          # names from the environment. The endpoint has no environment fallback in the tool,
          # so signCommand passes it as `-e %AZURE_ARTIFACT_SIGNING_ENDPOINT%` and lets cmd.exe
          # expand it.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        with:
          args: ${{ steps.signing.outputs.extra_args }}

      # On Windows the installer is both the download and the update payload, so only its
      # .sig has to be added. The updater-manifest job reads that .sig back off the release.
      - name: Attach the installer and its update signature to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "DIN Replicator $TAG" --notes "" \
            || gh release view "$TAG" >/dev/null
          nsis=src-tauri/target/release/bundle/nsis
          gh release upload "$TAG" --clobber "$nsis"/*-setup.exe
          if ls "$nsis"/*-setup.exe.sig >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "$nsis"/*-setup.exe.sig
          else
            echo "::warning title=No update signature::TAURI_SIGNING_PRIVATE_KEY is not set, so the installer carries no update signature and installed apps will not see this release."
          fi

  # An installed app reads this repository's releases/latest/download/latest.json, which
  # GitHub redirects to the copy on the most recent published release. The file names a
  # download and a minisign signature per platform, and the app refuses anything the public
  # key in tauri.conf.json does not verify. Format:
  # https://v2.tauri.app/plugin/updater/#static-json-file
  #
  # This runs after both platform jobs so every artifact it points at is already on the
  # release. It reads the notes as they stand at that moment, so notes written after the
  # workflow finishes reach the release page but not the update prompt. Re-run this job to
  # pick them up.
  updater-manifest:
    name: Update manifest
    needs: [macos, windows]
    permissions:
      contents: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Build latest.json and attach it to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The updater compares this against the version compiled into the app, so it is the
          # bare semver the tag carries.
          version="${TAG#v}"
          notes=$(gh release view "$TAG" --json body --jq '.body')
          if [ -z "$notes" ]; then
            notes="DIN Replicator $version"
          fi

          # Only the signatures have to come down; they are a few hundred bytes each.
          # A release with no signature at all makes this command fail, and the per-platform
          # check below turns that into a message that says which platform is missing.
          mkdir -p signatures
          gh release download "$TAG" --dir signatures --pattern '*.sig' --clobber || true

          # Asset names are not the file names: GitHub turns every space into a dot when it
          # stores an asset, so the URLs are built from the names the release actually holds.
          gh release view "$TAG" --json assets --jq '.assets[].name' > asset-names.txt
          echo "Assets on $TAG:"
          sed 's/^/  /' asset-names.txt

          platforms='{}'

          # $1 platform key, $2 suffix of the downloaded asset, $3 suffix of its signature.
          add_platform() {
            local key="$1" asset_suffix="$2" signature_suffix="$3"
            local asset signature_file signature url
            asset=$(grep -- "${asset_suffix}\$" asset-names.txt | head -n 1 || true)
            signature_file=$(ls signatures/*"${signature_suffix}" 2>/dev/null | head -n 1 || true)
            if [ -z "$asset" ] || [ -z "$signature_file" ]; then
              echo "::warning title=No update for $key::This release carries no signed $asset_suffix, so apps on $key will not be offered it."
              return
            fi
            signature=$(cat "$signature_file")
            url="https://github.com/${REPO}/releases/download/${TAG}/${asset}"
            platforms=$(jq -n --arg key "$key" --arg signature "$signature" --arg url "$url" \
              --argjson platforms "$platforms" \
              '$platforms + {($key): {signature: $signature, url: $url}}')
          }

          # The DMG and the NSIS installer are the human downloads; the update payloads are the
          # .app.tar.gz on macOS and that same installer on Windows.
          add_platform darwin-aarch64 '.app.tar.gz' '.app.tar.gz.sig'
          add_platform windows-x86_64 '-setup.exe' '-setup.exe.sig'

          if [ "$(jq 'length' <<<"$platforms")" -eq 0 ]; then
            echo "no platform carries an update signature, so latest.json would offer nothing" >&2
            exit 1
          fi

          jq -n --arg version "$version" --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json
          cat latest.json

          gh release upload "$TAG" --clobber latest.json
