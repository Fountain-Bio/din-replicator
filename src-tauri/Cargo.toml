[package]
name = "din-replicator"
version = "0.1.0"
description = "Scans an ISBT 128 DIN label and prints replica labels on a USB Zebra printer"
authors = ["DIN Replicator contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "din_replicator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

# The Windows print path talks to the spooler directly. Win32_Graphics_Gdi and
# Win32_Security are needed because PRINTER_INFO_2W holds a DEVMODEW pointer and
# a security descriptor.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
