[package]
name = "din-replicator"
version = "1.0.1"
description = "Scans an ISBT 128 DIN label and prints replica labels on a USB Zebra printer"
authors = ["DIN Replicator contributors"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "din_replicator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

# The print log and the settings are one SQLite file per machine (ADR 0004).
# The `bundled` feature compiles SQLite into the app, so a Windows machine
# needs nothing installed for the log to work.
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Print run timestamps are RFC 3339 in UTC. `clock` is the feature that reads
# the system clock; the rest of chrono is left out.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# The operator is the operating system user name plus the computer name.
whoami = "2.1.3"

# The app checks a signed release manifest on GitHub for a newer version and
# installs it in place. `tauri-plugin-process` supplies the relaunch that has to
# follow an install. Neither plugin builds for mobile, and the app only ships for
# macOS and Windows, so both are limited to those two targets.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

# The Windows print path talks to the spooler directly. Win32_Graphics_Gdi and
# Win32_Security are needed because PRINTER_INFO_2W holds a DEVMODEW pointer and
# a security descriptor.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security"]


[dev-dependencies]
# Tests that open a real database file put it in a directory that deletes
# itself afterwards.
tempfile = "3.27.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
